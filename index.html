<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Britany</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400&display=swap">
<style>
/* Layout: una sola pantalla, nombre y mensaje arriba, el corazón de partículas ocupa el resto, pista abajo. */
:root{
  --bg:#240B18;
  --fg:#FFE3EA;
  --muted:#D49BAE;
  --p1:#FF7A9C;
  --p2:#FFB3C6;
  --p3:#FF9E7D;
  --p4:#E0527A;
  --hand:'Caveat','Segoe Script','Bradley Hand',cursive;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 16px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  align-items:center;
}
header{text-align:center;flex:none}
h1{
  margin:0;
  font-family:var(--hand);
  font-weight:600;
  font-size:clamp(48px,14vw,76px);
  line-height:1;
  color:var(--p2);
  text-wrap:balance;
}
.msg{
  margin:6px 0 0;
  font-family:var(--hand);
  font-weight:600;
  font-size:clamp(24px,6.5vw,32px);
  line-height:1.2;
  color:var(--fg);
  text-wrap:balance;
}
canvas{
  flex:1;
  min-height:260px;
  width:100%;
  max-width:560px;
  touch-action:none;
  display:block;
}
.hint{
  flex:none;
  margin:0;
  font-size:14px;
  letter-spacing:.04em;
  color:var(--muted);
}
</style>
</head>
<body>

<header>
  <h1>Para Britany</h1>
  <p class="msg">Eres mi lugar favorito</p>
</header>
<canvas id="cv" aria-label="Un corazón hecho de partículas que late"></canvas>
<p class="hint">Toca el corazón</p>

<script>
(function(){
  var c=document.getElementById('cv'),x=c.getContext('2d');
  var dpr=window.devicePixelRatio||1,W=300,H=300;
  var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cs=getComputedStyle(document.documentElement);
  var cols=['--p1','--p2','--p3','--p4'].map(function(n){return cs.getPropertyValue(n).trim()});
  function size(){
    var r=c.getBoundingClientRect();
    W=Math.max(1,r.width);H=Math.max(1,r.height);
    c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);
    x.setTransform(dpr,0,0,dpr,0,0);
  }
  function heart(t){
    return [16*Math.pow(Math.sin(t),3),
            13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)];
  }
  function target(i){
    var t=Math.random()*Math.PI*2;
    var s=(i%2)?1:Math.sqrt(Math.random())*0.95;
    var h=heart(t);
    return [h[0]*s,(h[1]+3)*s];
  }
  size();
  var N=320,P=[];
  for(var i=0;i<N;i++){
    var g=target(i);
    P.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,gx:g[0],gy:g[1],
            r:1.6+Math.random()*2.4,c:cols[i%4]});
  }
  var ptr=null,tm=0;
  function pos(e){var r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  function burst(px,py,power){
    for(var j=0;j<P.length;j++){
      var p=P[j],dx=p.x-px,dy=p.y-py,d=Math.hypot(dx,dy)||1;
      var f=power*Math.max(0,1-d/(Math.min(W,H)*0.8));
      p.vx+=dx/d*f;p.vy+=dy/d*f;
    }
  }
  c.addEventListener('pointerdown',function(e){
    ptr=pos(e);
    try{c.setPointerCapture(e.pointerId)}catch(_){}
    burst(ptr.x,ptr.y,rm?2:9);
  });
  c.addEventListener('pointermove',function(e){if(ptr)ptr=pos(e)});
  c.addEventListener('pointerup',function(){ptr=null});
  c.addEventListener('pointercancel',function(){ptr=null});
  if(window.ResizeObserver){new ResizeObserver(size).observe(c)}else{window.addEventListener('resize',size)}
  function loop(){
    tm+=0.035;
    var k=Math.min(W/38,H/34),cx=W/2,cy=H/2+4;
    var b=Math.pow(Math.max(0,Math.sin(tm*2)),6);
    var sc=rm?1:1+0.07*b;
    for(var i=0;i<P.length;i++){
      var p=P[i];
      var X=cx+p.gx*k*sc,Y=cy-p.gy*k*sc;
      p.vx+=(X-p.x)*0.035;p.vy+=(Y-p.y)*0.035;
      if(ptr){
        var dx=p.x-ptr.x,dy=p.y-ptr.y,d=Math.hypot(dx,dy)||1;
        if(d<70){p.vx+=dx/d*2.2;p.vy+=dy/d*2.2}
      }
      p.vx*=0.86;p.vy*=0.86;p.x+=p.vx;p.y+=p.vy;
    }
    x.clearRect(0,0,W,H);
    for(var j=0;j<P.length;j++){
      var q=P[j];
      x.fillStyle=q.c;
      x.beginPath();x.arc(q.x,q.y,q.r,0,6.2832);x.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
